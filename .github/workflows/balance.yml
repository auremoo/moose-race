name: Équilibrage (chaque nuit)

# Rejoue les critères d'équilibrage du cahier (duels simulés sans rendu).
# Le job échoue si un critère tombe : GitHub prévient alors le propriétaire du dépôt.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx tools/balance-sim.ts 1000
