<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D80621" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Panache</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D80621'/%3E%3Cpath d='M32 10l4 10 8-4-3 10 9 1-8 7 2 4-12-2v14h-2V36l-12 2 2-4-8-7 9-1-3-10 8 4z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div class="hud-row">
          <div class="pill" id="hud-lap">Tour 1/2</div>
          <div class="pill pill-time" id="hud-time">0:00.00</div>
          <button class="btn-icon" id="btn-pause" aria-label="Pause">
            <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="hud-row hud-row-sub">
          <div class="pill pill-small" id="hud-best"></div>
          <div class="gauge" id="gauge">
            <svg viewBox="0 0 140 84" width="112" height="67" aria-hidden="true">
              <g id="gauge-arcs"></g>
              <g id="gauge-ticks"></g>
              <line id="gauge-needle" x1="70" y1="72" x2="70" y2="20" stroke="#5B3A29" stroke-width="4" stroke-linecap="round" />
              <circle cx="70" cy="72" r="7" fill="#5B3A29" />
            </svg>
            <div class="gauge-value"><span id="hud-speed">0</span><small id="hud-kmh">km/h</small></div>
            <div class="gauge-gait" id="hud-gait"></div>
          </div>
        </div>
        <div id="hud-flash"></div>
      </div>

      <div id="countdown"></div>

      <div id="steer-zone">
        <div id="steer-hint"></div>
        <div id="knob-base"><div id="knob"></div></div>
      </div>

      <pre id="debug"></pre>

      <div class="overlay" id="pause-menu" hidden>
        <div class="card">
          <h2 id="pause-title"></h2>
          <button class="btn btn-red" id="btn-resume"></button>
          <button class="btn btn-white" id="btn-restart"></button>
          <label class="setting">
            <span id="lbl-sensitivity"></span>
            <input type="range" id="rng-sensitivity" min="0.5" max="2" step="0.05" />
          </label>
          <label class="setting setting-row">
            <span id="lbl-debug"></span>
            <input type="checkbox" id="chk-debug" />
          </label>
          <div class="setting">
            <span id="lbl-language"></span>
            <div class="segmented" role="group">
              <button class="seg" data-lang="fr">Français</button>
              <button class="seg" data-lang="en">English</button>
            </div>
          </div>
          <p class="muted" id="lbl-sound"></p>
        </div>
      </div>

      <div class="overlay" id="results" hidden>
        <div class="card">
          <h2 id="res-title"></h2>
          <div class="res-line"><span id="res-total-lbl"></span><strong id="res-total"></strong></div>
          <div class="res-line"><span id="res-best-lbl"></span><strong id="res-best"></strong></div>
          <div id="res-laps"></div>
          <div id="res-record" class="record"></div>
          <button class="btn btn-red" id="btn-replay"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
